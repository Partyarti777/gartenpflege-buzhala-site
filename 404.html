<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#3FBFB5">
<title>Seite nicht gefunden – Gartenpflege Buzhala</title>
<meta name="description" content="Die angeforderte Seite existiert nicht. Zurück zur Startseite von Gartenpflege Buzhala." />
<meta name="robots" content="noindex,follow" />
<link rel="canonical" href="https://www.gartenpflegeservicebuzhala.de/" />
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<!-- ===== Preconnect: Contact-Worker (Form-Submit, spart ~100ms DNS+TLS) ===== -->
<link rel="preconnect" href="https://buzhala-contact.buzhala-contact-worker.workers.dev" crossorigin>
<link rel="stylesheet" href="brand.css?v=19">
<link rel="stylesheet" href="main.css?v=19">
<link rel="stylesheet" href="assets/css/ext-2click.css?v=1">
<style>
  /* 404 — zentriertes Hero-Layout */
  .notfound-page {
    min-height: 60vh;
    display: flex; align-items: center; justify-content: center;
    padding: 60px 24px;
    text-align: center;
  }
  .notfound-page .lbl-404 {
    font-family: 'Poppins', sans-serif;
    font-size: clamp(5rem, 18vw, 9rem);
    font-weight: 700;
    color: var(--primary);
    line-height: 1;
    margin: 0 0 12px;
    letter-spacing: -0.02em;
  }
  .notfound-page h1 {
    font-family: 'Poppins', sans-serif;
    font-size: clamp(1.5rem, 4.5vw, 2rem);
    margin: 0 0 14px;
    color: var(--ink);
  }
  .notfound-page p {
    color: #4a5e57;
    max-width: 520px;
    margin: 0 auto 28px;
    line-height: 1.55;
  }
  .notfound-page .cta {
    display: inline-flex; align-items: center; gap: 8px;
    background: var(--primary);
    color: white !important;
    padding: 14px 28px;
    border-radius: 999px;
    font-family: 'Poppins', sans-serif;
    font-weight: 600;
    text-decoration: none;
    box-shadow: 0 4px 14px -6px rgba(31,107,74,.5);
    transition: background-color .15s ease, transform .15s ease;
  }
  .notfound-page .cta:hover {
    background: var(--primary-dark);
    transform: translateY(-1px);
    color: white !important;
  }
  .notfound-page .cta:focus-visible {
    outline: 3px solid rgba(63,191,181,.45);
    outline-offset: 2px;
  }
</style>
</head>
<body>

<div id="site-header-mount"></div>

<section class="notfound-page" aria-label="Seite nicht gefunden">
  <div class="wrap">
    <div class="lbl-404" aria-hidden="true">404</div>
    <h1>Seite nicht gefunden</h1>
    <p>Die Seite, die du suchst, existiert nicht oder wurde verschoben.</p>
    <a class="cta" href="/">Zurück zur Startseite</a>
  </div>
</section>

<div id="site-footer-mount"></div>

<script src="assets/js/partials.js?v=2" defer></script>
<script src="assets/js/mobile-menu.js?v=1" defer></script>
<script src="assets/js/ext-2click.js?v=1" defer></script>
<script src="assets/js/cookie-banner.js?v=2" defer></script>
</body>
</html>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbfaf6"/>
      <stop offset="100%" stop-color="#f3efe2"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3fbfb5"/>
      <stop offset="100%" stop-color="#1f6b4a"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5a8a4d"/>
      <stop offset="100%" stop-color="#2d4f25"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Decorative leaves top-right -->
  <g opacity="0.18" transform="translate(900,40)">
    <path d="M0,200 Q50,100 150,80 Q100,180 0,200Z" fill="url(#leaf)"/>
    <path d="M60,260 Q140,180 260,160 Q200,280 60,260Z" fill="url(#leaf)"/>
    <path d="M-40,140 Q40,40 140,20 Q90,140 -40,140Z" fill="#3a6b3a"/>
  </g>

  <!-- Decorative leaves bottom-left -->
  <g opacity="0.14" transform="translate(20,440) scale(-1,1)">
    <path d="M0,200 Q50,100 150,80 Q100,180 0,200Z" fill="url(#leaf)"/>
    <path d="M60,260 Q140,180 260,160 Q200,280 60,260Z" fill="url(#leaf)"/>
  </g>

  <!-- Brand mark -->
  <g transform="translate(80,150)">
    <rect width="120" height="120" rx="26" fill="url(#mark)"/>
    <!-- Tree icon -->
    <g transform="translate(60,60)" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M0 26 V -8"/>
      <path d="M0 -8 C-10 -22 -28 -28 -42 -32 C-40 -8 -22 8 0 -2 Z"/>
      <path d="M0 -8 C10 -22 28 -28 42 -32 C40 -8 22 8 0 -2 Z"/>
      <path d="M-22 30 H 22"/>
    </g>
  </g>

  <!-- Title -->
  <text x="80" y="340" font-family="Poppins, system-ui, sans-serif" font-weight="800" font-size="68" fill="#0b1f17" letter-spacing="-1.2">Gartenpflege Buzhala</text>

  <!-- Tagline -->
  <text x="80" y="400" font-family="Inter, system-ui, sans-serif" font-weight="600" font-size="34" fill="#1f6b4a">Külsheim · Main-Tauber-Kreis · seit 2017</text>

  <!-- Description -->
  <text x="80" y="465" font-family="Inter, system-ui, sans-serif" font-weight="500" font-size="26" fill="#45554c">Heckenschnitt · Rollrasen · Pflaster · Gartengestaltung</text>

  <!-- Trust strip -->
  <g transform="translate(80,510)">
    <!-- 23+ years -->
    <g transform="translate(0,0)">
      <rect width="220" height="60" rx="12" fill="#ffffff" stroke="#e2e8e3" stroke-width="2"/>
      <text x="20" y="40" font-family="Poppins, sans-serif" font-weight="700" font-size="24" fill="#0b1f17">23+ Jahre Erfahrung</text>
    </g>
    <!-- 4.8 stars -->
    <g transform="translate(240,0)">
      <rect width="200" height="60" rx="12" fill="#ffffff" stroke="#e2e8e3" stroke-width="2"/>
      <text x="20" y="40" font-family="Poppins, sans-serif" font-weight="700" font-size="22" fill="#0b1f17">4,8 ★ Google (6)</text>
    </g>
    <!-- Free quote -->
    <g transform="translate(460,0)">
      <rect width="280" height="60" rx="12" fill="#3fbfb5"/>
      <text x="20" y="40" font-family="Poppins, sans-serif" font-weight="700" font-size="22" fill="#ffffff">Kostenlose Vor-Ort-Beratung</text>
    </g>
  </g>

  <!-- Phone strip bottom-right -->
  <g transform="translate(820,580)">
    <text x="0" y="0" font-family="Inter, sans-serif" font-weight="600" font-size="22" fill="#1f6b4a" text-anchor="end">📞 01573 4405927 · 09345 927534</text>
  </g>
</svg>
